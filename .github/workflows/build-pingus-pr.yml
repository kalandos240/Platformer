name: PR Pingus Web Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: public-pingus-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: emscripten/emsdk:3.1.64
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Install host packages
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bzip2 ca-certificates curl git libboost-dev python3 zip
          em++ --version

      - name: Clone build scripts
        run: |
          set -eux
          git clone --depth 1 --single-branch --branch "$SOURCE_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Download original Pingus 0.7.6
        working-directory: repo
        run: |
          set -eux
          curl -L --fail --retry 3 --retry-all-errors \
            https://deb.debian.org/debian/pool/main/p/pingus/pingus_0.7.6.orig.tar.bz2 \
            -o pingus.tar.bz2
          tar -xjf pingus.tar.bz2
          mv pingus-0.7.6 pingus-src
          cp tools/build_web.sh pingus-src/build_web.sh

      - name: Compile original source to WebAssembly
        id: compile
        working-directory: repo
        shell: bash
        run: |
          set +e
          set -o pipefail
          cd pingus-src
          bash build_web.sh 2>&1 | tee ../build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and package Yandex build
        if: steps.compile.outputs.exit_code == '0'
        working-directory: repo
        run: |
          set -eux
          test -s dist/index.html
          test -s dist/index.js
          test -s dist/index.wasm
          test -s dist/index.data
          grep -q 'Pingus' dist/index.html
          cp pingus-src/COPYING dist/COPYING
          cp pingus-src/AUTHORS dist/AUTHORS
          cat > dist/README.txt <<'EOF'
          Pingus 0.7.6 WebAssembly port for Yandex Games.
          Upload this ZIP directly to Yandex Console. index.html is in the archive root.
          EOF
          cat > dist/SOURCE-OFFER.txt <<'EOF'
          This build contains GPL-licensed Pingus code and data.
          Original source: https://github.com/Pingus/pingus/tree/v0.7.6
          Port source and build scripts: https://github.com/kalandos240/pingus-yandex-web-port
          EOF
          printf 'commit=%s\nrun_id=%s\nemscripten=3.1.64\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD-INFO.txt
          invalid_names=$(find dist -type f -printf '%P\n' | LC_ALL=C grep -E '[[:space:]]|[^ -~]' || true)
          test -z "$invalid_names"
          uncompressed_bytes=$(du -sb dist | cut -f1)
          printf 'uncompressed_bytes=%s\n' "$uncompressed_bytes" | tee size-report.txt
          test "$uncompressed_bytes" -le 100000000
          (cd dist && zip -9 -X -r ../pingus-yandex-web.zip .)
          test -s pingus-yandex-web.zip
          for file in index.html index.js index.wasm index.data COPYING; do
            zipinfo -1 pingus-yandex-web.zip | grep -qx "$file"
          done
          sha256sum pingus-yandex-web.zip | tee checksum.txt
          du -sh dist pingus-yandex-web.zip | tee -a size-report.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pingus-build-diagnostics
          path: |
            repo/build.log
            repo/size-report.txt
            repo/checksum.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Yandex ZIP
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: pingus-yandex-web
          path: repo/pingus-yandex-web.zip
          if-no-files-found: error
          retention-days: 30

      - name: Fail on compilation error
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
